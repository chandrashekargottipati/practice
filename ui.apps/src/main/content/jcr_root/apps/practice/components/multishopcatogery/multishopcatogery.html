<sly data-sly-use.model="com.adobe.aem.guides.practice.core.models.CategoryListModel">
    <div class="container-fluid pt-5">
        <h2 class="section-title position-relative text-uppercase mx-xl-5 mb-4">
            <span class="bg-secondary pr-3">Categories</span>
        </h2>
        <div class="row px-xl-5 pb-3">
            <sly data-sly-list.category="${model.categories}">
                <div class="col-lg-3 col-md-4 col-sm-6 pb-1">
                    <a class="text-decoration-none" href="#">
                        <div class="cat-item d-flex align-items-center mb-4">
                            <div class="category-img">
                                <img class="img-fluid" src="${category.image}" alt="${category.title}"/>
                            </div>
                            <div class="flex-fill pl-3">
                                <h6>${category.title}</h6>
                                <small class="text-body">View Products</small>
                            </div>
                        </div>
                    </a>
                </div>
            </sly>
        </div>
    </div>
</sly>
