<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.js @ categories='practice.register'}"/>
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.css @ categories='practice.register'}"/>

<div class="register-container">
    <h2>Create Account</h2>
    <form id="registerForm">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <span class="error-message" id="username-error"></span>
        </div>
        
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <span class="error-message" id="email-error"></span>
        </div>
        
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <span class="error-message" id="password-error"></span>
        </div>
        
        <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
            <span class="error-message" id="confirm-password-error"></span>
        </div>
        
        <button type="submit" class="register-btn">Create Account</button>
        <p class="login-link">Already have an account? <a href="/content/practice/en/login.html">Sign In</a></p>
        <div id="registerMessage" class="message"></div>
    </form>
</div>
